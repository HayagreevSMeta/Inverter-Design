<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        .slide-container {
            width: 1280px;
            min-height: 720px;
            background: #FFFFFF;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .slide-container::before {
            content: "";
            position: absolute;
            inset: 0;
            background-image: url('/home/ubuntu/Inverter-Design/fc_inverter_schematic.png');
            background-size: 500px;
            background-position: right center;
            background-repeat: no-repeat;
            opacity: 0.06;
        }
        .accent-bar {
            position: absolute;
            top: 0;
            left: 0;
            width: 6px;
            height: 100%;
            background: #2563EB;
        }
        .content {
            position: relative;
            z-index: 2;
            margin-left: 80px;
            margin-right: 80px;
        }
        h1 {
            font-family: 'Inter', sans-serif;
            font-weight: 700;
            font-size: 56px;
            color: #000000;
            line-height: 1.15;
            margin-bottom: 24px;
        }
        .subtitle {
            font-family: 'Inter', sans-serif;
            font-weight: 400;
            font-size: 24px;
            color: #333333;
            margin-bottom: 48px;
        }
        .author {
            font-family: 'Inter', sans-serif;
            font-weight: 700;
            font-size: 20px;
            color: #000000;
        }
        .dept {
            font-family: 'Inter', sans-serif;
            font-weight: 400;
            font-size: 16px;
            color: #333333;
            margin-top: 4px;
        }
        .bottom-line {
            position: absolute;
            bottom: 40px;
            left: 80px;
            right: 80px;
            height: 2px;
            background: #000000;
        }
    </style>
</head>
<body>
    <div class="slide-container">
        <div class="accent-bar"></div>
        <div class="content">
            <h1>800V Three-Level Flying Capacitor Traction Inverter</h1>
            <div class="subtitle">Design and Comprehensive Loss Analysis</div>
            <div class="author">Hayagreev S.</div>
            <div class="dept">Department of Electrical Engineering</div>
        </div>
        <div class="bottom-line"></div>
    </div>
</body>
</html>
