<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&amp;display=swap" rel="stylesheet"/>
<style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        .slide-container {
            display: flex;
            flex-direction: column;
            width: 1280px;
            min-height: 720px;
            background: #FFFFFF;
            position: relative;
            padding: 60px 80px;
            font-family: 'Inter', sans-serif;
            color: #000000;
        }
        h2 {
            flex: 0 0 auto;
            font-weight: 700;
            font-size: 36px;
            margin-bottom: 40px;
            border-bottom: 2px solid #000000;
            padding-bottom: 10px;
        }
        p {
            font-size: 20px;
            line-height: 1.5;
            margin-bottom: 20px;
        }
        ul { list-style-type: disc; }
        ol { list-style-type: decimal; }
        ul, ol {
            list-style-position: outside;
            margin-left: 40px;
            padding-left: 20px;
            margin-left: 40px;
            margin-bottom: 20px;
            font-size: 20px;
            line-height: 1.5;
        }
        li {
            margin-bottom: 10px;
        }
        .two-col {
            flex: 1 1 auto;
            align-items: center;
            display: grid;
            grid-template-columns: 1fr 1fr;
            min-width: 0;
            gap: 40px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
            font-size: 18px;
        }
        th, td {
            border: 1px solid #000000;
            padding: 12px;
            text-align: left;
        }
        th {
            background-color: #F0F0F0;
            font-weight: bold;
        }
        .chart-container {
            max-width: 100%;
            min-width: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 500px;
        }
        .chart-container img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }
        .bold { font-weight: bold; }
        
        .title-slide {
            display: flex;
            flex-direction: column;
            justify-content: center;
            height: 100%;
            text-align: center;
        }
        .title-slide h1 {
            font-size: 48px;
            font-weight: bold;
            margin-bottom: 20px;
        }
        .title-slide h3 {
            font-size: 24px;
            font-weight: normal;
            margin-bottom: 40px;
        }
        </style>
</head>
<body>
<div class="slide-container title-slide">

<div>
<h1>800V Three-Level Flying Capacitor Traction Inverter</h1>
<div>Design and Comprehensive Loss Analysis</div>
<div>Hayagreev S.</div>
<div>ECE 595 - Purdue University</div>
</div>
<div></div>
</div>
</body>
</html>
