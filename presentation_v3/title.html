<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        .slide-container {
            width: 1280px;
            min-height: 720px;
            background: #FFFFFF;
            position: relative;
            font-family: 'Inter', sans-serif;
            color: #000000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 80px 120px;
        }
        .header-bar {
            position: absolute;
            top: 40px;
            left: 80px;
            font-size: 14px;
            font-weight: 700;
            color: #2563EB;
            letter-spacing: 1px;
        }
        .title-block {
            border-left: 6px solid #2563EB;
            padding-left: 40px;
        }
        h1 {
            font-size: 48px;
            font-weight: 700;
            line-height: 1.2;
            margin-bottom: 40px;
            color: #000000;
        }
        .author {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 10px;
        }
        .affiliation {
            font-size: 20px;
            color: #4B5563;
        }
    </style>
</head>
<body>
    <div class="slide-container">
        <div class="header-bar">ECE 595 — PURDUE UNIVERSITY</div>
        
        <div class="title-block">
            <h1>Design and Loss Analysis of an 800V Flying Capacitor Traction Inverter</h1>
            <div class="author">Hayagreev S.</div>
            <div class="affiliation">ECE 595 - Purdue University</div>
        </div>
    </div>
</body>
</html>
